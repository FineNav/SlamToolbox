name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build Python ${{ matrix.python-version }} wheel
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liboctomap-dev

      - name: Install Python build tools
        run: python -m pip install --upgrade pip build tomli

      - name: Verify tag and package versions
        run: |
          python - <<'PY'
          import pathlib
          import re
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          requested_version = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}".removeprefix("v")
          project_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          setup_text = pathlib.Path("setup.py").read_text()
          setup_version = re.search(r'version\s*=\s*["\x27]([^"\x27]+)', setup_text).group(1)
          assert requested_version == project_version == setup_version, (
              f"version mismatch: requested={requested_version}, pyproject={project_version}, setup={setup_version}"
          )
          PY

      - name: Build wheel
        run: python -m build --wheel

      - name: Smoke-test wheel
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python -m venv /tmp/slam-toolbox-wheel-test
          /tmp/slam-toolbox-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/slam-toolbox-wheel-test/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from slam_toolbox import _native

          expected_version = os.environ["EXPECTED_VERSION"].removeprefix("v")
          assert version("slam_toolbox") == expected_version
          assert _native.api_version == 5
          print("package version:", version("slam_toolbox"))
          print("native api:", _native.api_version)
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build and validate source distribution
        run: |
          python -m build --sdist
          python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs:
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
