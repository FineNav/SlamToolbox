name: Auto Tag and Publish

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - 'setup.py'
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  auto-tag:
    name: Auto-create tag from setup.py
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.create_tag.outputs.created }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from setup.py
        id: version
        run: |
          VERSION=$(grep -Po 'version\s*=\s*"\K[^"]*' setup.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Create and push tag
        id: create_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG created and pushed."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    name: Build Python ${{ matrix.python-version }} wheel
    needs: [auto-tag]
    if: always() && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || needs.auto-tag.outputs.created == 'true')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liboctomap-dev

      - name: Install Python build tools
        run: python -m pip install --upgrade pip auditwheel patchelf build tomli

      - name: Determine expected version
        id: expected
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v${{ needs.auto-tag.outputs.version }}"
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Expected version: ${VERSION#v}"

      - name: Verify tag and package versions
        run: |
          python - <<'PY'
          import pathlib
          import re
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          requested_version = "${{ steps.expected.outputs.version }}"
          project_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          setup_text = pathlib.Path("setup.py").read_text()
          setup_version = re.search(r'version\s*=\s*["\x27]([^"\x27]+)', setup_text).group(1)
          assert requested_version == project_version == setup_version, (
              f"version mismatch: requested={requested_version}, pyproject={project_version}, setup={setup_version}"
          )
          PY

      - name: Build wheel
        run: |
          python -m build --wheel
          python -m auditwheel repair dist/*.whl --wheel-dir wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Smoke-test wheel
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
        run: |
          python -m venv /tmp/slam-toolbox-wheel-test
          /tmp/slam-toolbox-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/slam-toolbox-wheel-test/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          from slam_toolbox import _native

          expected_version = os.environ["EXPECTED_VERSION"]
          assert version("slam_toolbox") == expected_version
          assert _native.api_version == 5
          print("package version:", version("slam_toolbox"))
          print("native api:", _native.api_version)
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: [auto-tag]
    if: always() && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || needs.auto-tag.outputs.created == 'true')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Python build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build and validate source distribution
        run: |
          python -m build --sdist
          python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs:
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
